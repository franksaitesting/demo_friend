<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Friend</title>
  <style>
    :root { --bg:#fff; --text:#1f2430; --muted:#6b7280; --accent:#5b3df5; --ok:#16a34a; --err:#dc2626; --border:#e3e3e8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#17181c; --text:#e6e7eb; --muted:#9aa0ab; --accent:#8b74ff; --border:#2e3038; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    h1 { font-size:15px; margin:0 0 14px; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
    .dot.ok { background:var(--ok); } .dot.err { background:var(--err); }
    .step { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
    .step h2 { font-size:13px; margin:0 0 4px; }
    .step p { margin:0 0 10px; color:var(--muted); font-size:12.5px; white-space:pre-line; }
    button { width:100%; font:inherit; font-weight:600; padding:10px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .status { margin-top:8px; font-size:12.5px; color:var(--muted); min-height:1.2em; }
    .status.ok { color:var(--ok); } .status.err { color:var(--err); }
    code { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  </style>
  <script src="https://dl.frontapp.com/libs/plugin-sdk-1.8.1.min.js"></script>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Demo Friend <span class="status" id="conn" style="margin:0 0 0 auto"></span></h1>

  <div class="step">
    <h2>Email 1 — Workspaces question</h2>
    <p id="preview1"></p>
    <button id="send1">Send email 1</button>
    <div class="status" id="status1">Starts a new conversation.</div>
  </div>

  <div class="step">
    <h2>Email 2 — Macros follow-up</h2>
    <p id="preview2"></p>
    <button id="send2" disabled>Send email 2</button>
    <div class="status" id="status2">Send email 1 first — this replies into that conversation.</div>
  </div>

<script>
/* ---------- fixed configuration (edit here, then re-upload this file) ---------- */
const API_URL = 'https://franks.app.n8n.cloud/webhook/demo-friend-api';

const EMAIL_1 = {
  subject: 'Question about our plan',
  body: "Hi,\n\nWe're starting to outgrow the setup we have and I'm thinking about splitting a few teams out. How many workspaces are allowed on our plan?\n\nThanks,\nTobias",
};
const EMAIL_2 = {
  subject: 'Re: Question about our plan',
  body: 'Thanks so much for the info!\n\nOne other thing — I saw the Macros feature recently and it looks very useful, is this included in our plan?\n\nIf so, are there any guides or walkthroughs you can point me to for getting up and running with macros?\n\nThanks,\nTobias',
};
/* Inbox, channel address and sender identity are fixed in the n8n Config node. */

/* ---------- plumbing ---------- */
const $ = (id) => document.getElementById(id);
const AUTH_SECRET = new URLSearchParams(location.search).get('auth_secret') || '';
const KEY = 'demo-friend:run';
let run = {};
try { run = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { run = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(run)); } catch {} };

$('preview1').textContent = EMAIL_1.body;
$('preview2').textContent = EMAIL_2.body;

async function api(action, params = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, auth_secret: AUTH_SECRET, ...params }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

function setStatus(el, text, kind) { el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }

function refresh() {
  if (run.conversation_id) {
    setStatus($('status1'), `Sent — conversation ${run.conversation_id}`, 'ok');
    $('send2').disabled = false;
    if (!run.sent2) setStatus($('status2'), `Will reply into ${run.conversation_id}.`);
  } else {
    $('send2').disabled = true;
  }
  if (run.sent2) setStatus($('status2'), `Sent — replied into ${run.conversation_id}`, 'ok');
}

async function locate(uid) {
  for (let i = 0; i < 8; i++) {
    await new Promise((r) => setTimeout(r, 4000));
    const r = await api('resolve', { message_uid: uid });
    if (r.ready) return r.conversation_id;
  }
  return null;
}

$('send1').addEventListener('click', async () => {
  const b = $('send1'); b.disabled = true; $('send2').disabled = true;
  run = {}; save(); refresh();
  setStatus($('status1'), 'Sending…');
  try {
    const r = await api('send', { subject: EMAIL_1.subject, body: EMAIL_1.body });
    setStatus($('status1'), 'Accepted — waiting for Front to create the conversation…');
    const id = await locate(r.message_uid);
    if (!id) throw new Error('Front accepted the email but has not created the conversation yet. Wait a moment and send email 1 again.');
    run = { conversation_id: id }; save(); refresh();
  } catch (e) {
    setStatus($('status1'), e.message, 'err');
  } finally { b.disabled = false; }
});

$('send2').addEventListener('click', async () => {
  if (!run.conversation_id) return;
  const b = $('send2'); b.disabled = true;
  setStatus($('status2'), 'Sending…');
  try {
    await api('send', { subject: EMAIL_2.subject, body: EMAIL_2.body, conversation_id: run.conversation_id });
    run.sent2 = true; save(); refresh();
  } catch (e) {
    setStatus($('status2'), e.message, 'err');
    b.disabled = false;
  }
});

/* connection check + Front SDK (teammate name only) */
(async () => {
  try {
    const h = await api('ping');
    $('dot').className = 'dot ok'; $('conn').textContent = h.company ? `Connected · ${h.company}` : 'Connected';
  } catch (e) {
    $('dot').className = 'dot err'; $('conn').textContent = /unauthori/i.test(e.message) ? 'Auth secret wrong' : 'Not connected';
  }
  refresh();
})();
if (window.Front && Front.contextUpdates) Front.contextUpdates.subscribe(() => {});
</script>
</body>
</html>
